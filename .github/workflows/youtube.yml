name: YouTube feed sync

# Every 90 minutes. Cron can't express 90 minutes in one line, so two
# lines interleave: :17 every third hour from 00, :47 every third hour
# from 01. Together: 00:17, 01:47, 03:17, 04:47 ... 22:47 UTC — 16 runs a
# day, evenly spaced, including across midnight.
#
# Quota (v4 script): 1 unit per quiet channel, 2 per channel with a new
# player video. ~3,900 units a day at 156 channels; the worst case for
# ~250 channels is ~8,000 of the 10,000 daily limit. The real count is
# printed at the end of every run's log.
on:
  schedule:
    - cron: '17 0-21/3 * * *'
    - cron: '47 1-22/3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'nightly (last 2 days) or bulk (last 12 months)'
        type: choice
        options: [nightly, bulk]
        default: nightly

jobs:
  sync:
    runs-on: ubuntu-latest
    # A pass takes a few minutes; this stops a wedged run from blocking
    # the next one.
    timeout-minutes: 30
    concurrency:
      group: youtube-sync
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Fetch videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ "${{ inputs.mode }}" = "bulk" ]; then
            python fetch_youtube_videos.py --bulk
          else
            python fetch_youtube_videos.py
          fi
